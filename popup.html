<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fingersmith Controls</title>
    <style>
      body {
          font-family: sans-serif;
          width: 200px;
          margin: 10px;
      }
      label {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <label>
      Enable Fingersmith
      <input type="checkbox" id="toggle" />
    </label>

    <label>
      Move All Touches
      <input type="checkbox" id="moveAll" />
    </label>

    <script src="popup.js"></script>
  </body>
</html>
